name: cleanup

# The GitHub Release is the deliverable; no artifacts are uploaded. Old run
# logs still count against account storage, so keep a week of them.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: delete old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cutoff="$(date -u -d '-7 days' +%Y-%m-%dT%H:%M:%SZ)"
          gh api --paginate "repos/${REPO}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .created_at] | @tsv' |
          while IFS="$(printf '\t')" read -r id created; do
            [ -z "${id}" ] && continue
            if [[ "${created}" < "${cutoff}" ]]; then
              gh api --method DELETE "repos/${REPO}/actions/runs/${id}" >/dev/null 2>&1 \
                || echo "could not delete run ${id}"
            fi
          done
