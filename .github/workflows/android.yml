name: android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  VERSION_NAME: "1.0"

jobs:
  build:
    name: build and release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: rust cache
        uses: Swatinem/rust-cache@v2

      - name: java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # install-action no longer carries cargo-ndk and its binstall fallback
      # pulls a release asset from github.com, which has 504'd mid-run.
      # Compiling from crates.io once and caching the binary avoids both.
      - name: cache cargo-ndk
        id: cargo-ndk-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-v1

      - name: install cargo-ndk
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      - name: android sdk
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if ! ls -1d "$SDK"/ndk/* >/dev/null 2>&1; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          fi
          ls -1d "$SDK"/ndk/*

      - name: rust tests
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: page tests
        run: |
          node --check android/assets/app.js
          node android/test/app.test.mjs

      # The signing key is not in the repo. Decode it from the repository secret
      # for this run only, then point build.sh at it.
      - name: signing key
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          PBB_KEYSTORE_B64: ${{ secrets.PBB_KEYSTORE_B64 }}
        run: |
          if [ -z "$PBB_KEYSTORE_B64" ]; then
            echo "missing PBB_KEYSTORE_B64 repository secret" >&2
            exit 1
          fi
          KEY="$RUNNER_TEMP/release.keystore"
          printf '%s' "$PBB_KEYSTORE_B64" | base64 -d > "$KEY"
          test -s "$KEY"
          echo "PBB_KEYSTORE=$KEY" >> "$GITHUB_ENV"

      - name: build apk
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          VERSION_CODE: ${{ github.run_number }}
          PBB_KEYSTORE_PASS: ${{ secrets.PBB_KEYSTORE_PASS }}
        run: ./build.sh

      - name: publish release v1.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          ASSET="PBB-$VERSION_NAME-$VERSION_CODE.apk"
          cp PBB.apk "$ASSET"
          SUM="$(sha256sum "$ASSET" | cut -d' ' -f1)"
          NOTES="$(printf 'PBB %s (build %s)\n\nsha256: %s\n\nThree PBB live DASH/clear-key streams, cinematic broadcast three-view, single-stream picture-in-picture, direct-pull recording to Movies/PBB.\n\nInstall: adb install -r %s' "$VERSION_NAME" "$VERSION_CODE" "$SUM" "$ASSET")"
          gh release view "v$VERSION_NAME" >/dev/null 2>&1 || \
            gh release create "v$VERSION_NAME" --title "PBB $VERSION_NAME" --notes "$NOTES"
          for old in $(gh release view "v$VERSION_NAME" --json assets --jq '.assets[].name'); do
            if [ "$old" != "$ASSET" ]; then
              gh release delete-asset "v$VERSION_NAME" "$old" --yes
            fi
          done
          gh release upload "v$VERSION_NAME" "$ASSET" --clobber
          gh release edit "v$VERSION_NAME" --notes "$NOTES"
