<!doctype html>
<html lang="en" data-type="software" data-theme="gold">
<head>
  <meta charset="utf-8">
  <meta name="page-type" content="software">
  <meta name="site-kind" content="software">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0E0E0F" id="themeColor">
  <title>PBB live</title>
  <link rel="stylesheet" href="styles.css">
  <script src="shaka-player.compiled.min.js"></script>
</head>
<body>
  <div class="page">
    <header class="nav">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
            <path d="M3 16 C7 9 25 9 29 16 C25 23 7 23 3 16 Z" fill="none" stroke="currentColor" stroke-width="1.8"></path>
            <circle cx="16" cy="16" r="4.6" fill="#E8B44A"></circle>
            <circle cx="16" cy="16" r="1.8" fill="#0E0E0F"></circle>
          </svg>
        </div>
        <div class="brand-copy">
          <h1>PBB live</h1>
        </div>
      </div>
      <div class="desk-actions">
        <button id="themeBtn" class="btn btn-ghost btn-icon" type="button" aria-label="choose color theme"></button>
        <div class="seg" role="group" aria-label="default quality">
          <button class="seg-btn" type="button" data-quality="hd">HD</button>
          <button class="seg-btn" type="button" data-quality="sd">SD</button>
        </div>
      </div>
    </header>

    <main class="stage">
      <div id="grid" class="grid" aria-label="live camera feeds"></div>
    </main>

    <footer class="status" id="statusBar">
      <div class="status-main">
        <span class="status-state" aria-hidden="true">
          <span class="status-led"></span>
        </span>
        <span class="status-copy">
          <span id="statusText" role="status" aria-atomic="true">connecting feeds...</span>
          <span class="status-meta" id="statusMeta">Server Jeo · HD</span>
        </span>
        <span class="rec-badge hidden" id="recBadge" aria-hidden="true">
          <span class="rec-badge-dot" aria-hidden="true"></span>
          <span id="recCount">0</span>
          <span class="rec-badge-label">rec</span>
          <span id="recTime">0:00</span>
        </span>
      </div>
      <div class="status-actions">
        <button id="sourceBtn" class="btn btn-ghost btn-icon" type="button" aria-label="choose stream server"></button>
        <button id="stitchBtn" class="btn btn-ghost btn-icon" type="button" aria-label="record main and dining together"></button>
        <button id="refreshBtn" class="btn btn-ghost btn-icon" type="button" aria-label="refresh streams"></button>
        <button id="backBtn" class="btn btn-ghost btn-icon hidden" type="button" aria-label="back to grid"></button>
      </div>
    </footer>
  </div>
  <div class="sheet hidden" id="themeSheet" role="dialog" aria-modal="true" aria-label="color theme">
    <div class="sheet-panel">
      <div class="sheet-head">
        <h2>theme</h2>
        <button id="themeClose" class="btn btn-ghost btn-icon" type="button" aria-label="close themes"></button>
      </div>
      <p class="sheet-intro">Material You colors. The theme stays on this phone.</p>
      <div class="sheet-chips" id="themeOptions" role="radiogroup" aria-label="color theme">
        <button class="chip" type="button" role="radio" aria-checked="true" data-theme="gold">
          <span class="chip-key theme-swatch gold" aria-hidden="true"></span>
          <span class="chip-name">Brand gold</span>
        </button>
        <button class="chip" type="button" role="radio" aria-checked="false" data-theme="blue">
          <span class="chip-key theme-swatch blue" aria-hidden="true"></span>
          <span class="chip-name">Blue hour</span>
        </button>
        <button class="chip" type="button" role="radio" aria-checked="false" data-theme="green">
          <span class="chip-key theme-swatch green" aria-hidden="true"></span>
          <span class="chip-name">Green room</span>
        </button>
        <button class="chip" type="button" role="radio" aria-checked="false" data-theme="violet">
          <span class="chip-key theme-swatch violet" aria-hidden="true"></span>
          <span class="chip-name">Night violet</span>
        </button>
      </div>
    </div>
  </div>
  <div class="sheet hidden" id="sourceSheet" role="dialog" aria-modal="true" aria-label="stream server">
    <div class="sheet-panel">
      <div class="sheet-head">
        <h2>server</h2>
        <button id="sourceClose" class="btn btn-ghost btn-icon" type="button" aria-label="close servers"></button>
      </div>
      <p class="sheet-intro">Switching routes reconnects all three feeds.</p>
      <h3 class="sheet-section-title">pbbcollab.com/live</h3>
      <div class="sheet-chips" id="serverChips" role="radiogroup" aria-label="collab site server">
        <button class="chip" type="button" role="radio" aria-checked="true" data-server="s1">
          <span class="chip-key" aria-hidden="true"></span>
          <span class="chip-name">Server Jeo</span>
        </button>
        <button class="chip" type="button" role="radio" aria-checked="false" data-server="pbbtop">
          <span class="chip-key" aria-hidden="true"></span>
          <span class="chip-name">Server Gehlee</span>
        </button>
        <button class="chip" type="button" role="radio" aria-checked="false" data-server="s2">
          <span class="chip-key" aria-hidden="true"></span>
          <span class="chip-name">Server Nathan</span>
        </button>
        <button class="chip" type="button" role="radio" aria-checked="false" data-server="s3">
          <span class="chip-key" aria-hidden="true"></span>
          <span class="chip-name">Server Primo</span>
        </button>
        <button class="chip" type="button" role="radio" aria-checked="false" data-server="s4">
          <span class="chip-key" aria-hidden="true"></span>
          <span class="chip-name">Server Bela</span>
        </button>
        <button class="chip" type="button" role="radio" aria-checked="false" data-server="twitch">
          <span class="chip-key" aria-hidden="true"></span>
          <span class="chip-name">Twitch Mirror</span>
        </button>
      </div>
      <p class="sheet-note" id="sourceNote"></p>
      <h3 class="sheet-section-title">pbbcollab.live</h3>
      <div class="sheet-chips" id="liveServerChips" role="radiogroup" aria-label="pbbcollab.live server">
        <button class="chip" type="button" role="radio" aria-checked="true" data-live-server="s1">
          <span class="chip-key" aria-hidden="true"></span>
          <span class="chip-copy">
            <span class="chip-name">Server 1</span>
            <span class="chip-note">Main server · recommended</span>
          </span>
        </button>
        <button class="chip" type="button" role="radio" aria-checked="false" data-live-server="s2">
          <span class="chip-key" aria-hidden="true"></span>
          <span class="chip-copy">
            <span class="chip-name">Server 2</span>
            <span class="chip-note">Backup server · fast</span>
          </span>
        </button>
        <button class="chip" type="button" role="radio" aria-checked="false" data-live-server="s3">
          <span class="chip-key" aria-hidden="true"></span>
          <span class="chip-copy">
            <span class="chip-name">Server 3</span>
            <span class="chip-note">Edge server · alternate</span>
          </span>
        </button>
        <button class="chip" type="button" role="radio" aria-checked="false" data-live-server="s4">
          <span class="chip-key" aria-hidden="true"></span>
          <span class="chip-copy">
            <span class="chip-name">Server 4</span>
            <span class="chip-note">Relay server · low latency</span>
          </span>
        </button>
        <button class="chip" type="button" role="radio" aria-checked="false" data-live-server="s5">
          <span class="chip-key" aria-hidden="true"></span>
          <span class="chip-copy">
            <span class="chip-name">Server 5</span>
            <span class="chip-note">Cloud mirror · ultra fast</span>
          </span>
        </button>
        <button class="chip" type="button" role="radio" aria-checked="false" data-live-server="s6">
          <span class="chip-key" aria-hidden="true"></span>
          <span class="chip-copy">
            <span class="chip-name">Server 6</span>
            <span class="chip-note">Global relay · ultra fast</span>
          </span>
        </button>
      </div>
    </div>
  </div>
  <div id="indicator" class="indicator hidden"></div>
  <div class="fs-controls" role="group" aria-label="fullscreen controls">
    <div class="fs-deck">
      <div class="fs-head">
        <span class="fs-air" aria-hidden="true"><span class="live-pip"></span>on air</span>
      </div>
      <div class="fs-keys">
        <button id="fsZoom" class="fs-key" type="button" aria-label="zoom">
          <span class="fs-glyph" aria-hidden="true"></span>
          <span class="fs-label">zoom</span>
        </button>
        <button id="fsSwitch" class="fs-key" type="button" aria-label="next live feed">
          <span class="fs-glyph" aria-hidden="true"></span>
          <span class="fs-label">next</span>
        </button>
        <button id="fsMini" class="fs-key" type="button" aria-label="mini feed">
          <span class="fs-glyph" aria-hidden="true"></span>
          <span class="fs-label">mini</span>
        </button>
        <button id="fsLock" class="fs-key lock-btn" type="button" aria-label="lock controls">
          <span class="fs-glyph" aria-hidden="true"></span>
          <span class="fs-label">lock</span>
        </button>
        <button id="fsExit" class="fs-key fs-exit" type="button" aria-label="exit fullscreen">
          <span class="fs-glyph" aria-hidden="true"></span>
          <span class="fs-label">exit</span>
        </button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
