<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FBF7DE" id="themeColor">
  <title>PBB live</title>
  <script>
    // The room's light switch, set before the first paint: a stored choice
    // wins, otherwise the desk follows the phone's own dark mode.
    (function () {
      var theme;
      try {
        theme = localStorage.getItem("pbb-theme");
      } catch (e) {
        theme = null;
      }
      if (theme !== "dark" && theme !== "light") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <script src="shaka-player.compiled.min.js"></script>
</head>
<body>
  <div class="page">
    <header class="nav">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
            <path d="M2.5 16 C6 9.5, 26 9.5, 29.5 16 C26 22.5, 6 22.5, 2.5 16 Z" fill="#FFE566" stroke="currentColor" stroke-width="1.8"></path>
            <circle cx="16" cy="16" r="4.6" fill="#E8635A" stroke="currentColor" stroke-width="1.8"></circle>
            <circle cx="16" cy="16" r="1.9" fill="#14110C"></circle>
          </svg>
        </div>
        <div class="brand-copy">
          <h1>pbb live</h1>
          <p>three cameras around the house, streaming now</p>
        </div>
      </div>
      <div class="desk-actions">
        <span class="live-tag"><span class="live-pip" aria-hidden="true"></span>3 live</span>
        <div class="seg" role="group" aria-label="default quality">
          <span class="seg-label">quality</span>
          <button class="seg-btn" type="button" data-quality="auto">auto</button>
          <button class="seg-btn" type="button" data-quality="hd">hd</button>
          <button class="seg-btn" type="button" data-quality="sd">sd</button>
        </div>
        <button id="themeBtn" class="desk-key" type="button" aria-label="switch to dark theme"></button>
      </div>
    </header>

    <main class="stage">
      <div id="grid" class="grid" aria-label="live camera feeds"></div>
    </main>

    <footer class="status" id="statusBar">
      <span class="status-led" aria-hidden="true"></span>
      <span id="statusText" role="status" aria-atomic="true">connecting three feeds...</span>
      <span class="rec-badge hidden" id="recBadge" aria-hidden="true">
        <span class="rec-badge-dot" aria-hidden="true"></span>
        <span id="recCount">0</span>
        <span class="rec-badge-label">rec</span>
        <span id="recTime">0:00</span>
      </span>
      <button id="sourceBtn" class="btn btn-ghost btn-icon" type="button" aria-label="edit stream source"></button>
      <button id="stitchBtn" class="btn btn-ghost btn-icon" type="button" aria-label="record main and dining together"></button>
      <button id="refreshBtn" class="btn btn-ghost btn-icon" type="button" aria-label="refresh streams"></button>
      <button id="backBtn" class="btn btn-ghost btn-icon hidden" type="button" aria-label="back to grid"></button>
    </footer>
  </div>
  <div class="sheet hidden" id="sourceSheet" role="dialog" aria-modal="true" aria-label="stream source">
    <div class="sheet-panel">
      <div class="sheet-head">
        <h2>sources</h2>
        <button id="sourceClose" class="btn btn-ghost btn-icon" type="button" aria-label="close sources"></button>
      </div>
      <div class="sheet-chips" id="sourceChips" role="group" aria-label="channel"></div>
      <div class="sheet-field">
        <span>channel list server</span>
        <div class="sheet-chips" id="serverChips" role="group" aria-label="channel list server">
          <button class="chip" type="button" data-source="0">auto</button>
          <button class="chip" type="button" data-source="1">gist</button>
          <button class="chip" type="button" data-source="2">lovable</button>
          <button class="chip" type="button" data-source="3">pages.dev</button>
        </div>
      </div>
      <label class="sheet-field">
        <span>manifest (.mpd)</span>
        <input id="sourceUrl" class="sheet-input" type="text" inputmode="url" autocomplete="off" spellcheck="false">
      </label>
      <label class="sheet-field">
        <span>kid</span>
        <input id="sourceKid" class="sheet-input" type="text" autocomplete="off" spellcheck="false">
      </label>
      <label class="sheet-field">
        <span>key</span>
        <input id="sourceKey" class="sheet-input" type="text" autocomplete="off" spellcheck="false">
      </label>
      <p class="sheet-note" id="sourceNote">paste a manifest link or a kid:key line into any box - it fills the rest</p>
      <div class="sheet-actions">
        <button id="sourceDetect" class="btn btn-ghost" type="button">detect kid</button>
        <button id="sourceApply" class="btn" type="button">apply</button>
      </div>
    </div>
  </div>
  <div id="indicator" class="indicator hidden"></div>
  <div class="fs-controls" role="group" aria-label="fullscreen controls">
    <div class="fs-deck">
      <div class="fs-head">
        <span class="fs-air" aria-hidden="true"><span class="live-pip"></span>on air</span>
      </div>
      <div class="fs-keys">
        <button id="fsZoom" class="fs-key" type="button" aria-label="zoom">
          <span class="fs-glyph" aria-hidden="true"></span>
          <span class="fs-label">zoom</span>
        </button>
        <button id="fsSwitch" class="fs-key" type="button" aria-label="next live feed">
          <span class="fs-glyph" aria-hidden="true"></span>
          <span class="fs-label">next</span>
        </button>
        <button id="fsMini" class="fs-key" type="button" aria-label="mini feed">
          <span class="fs-glyph" aria-hidden="true"></span>
          <span class="fs-label">mini</span>
        </button>
        <button id="fsLock" class="fs-key lock-btn" type="button" aria-label="lock controls">
          <span class="fs-glyph" aria-hidden="true"></span>
          <span class="fs-label">lock</span>
        </button>
        <button id="fsExit" class="fs-key fs-exit" type="button" aria-label="exit fullscreen">
          <span class="fs-glyph" aria-hidden="true"></span>
          <span class="fs-label">exit</span>
        </button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
