<!doctype html>
<html lang="en" data-type="software">
<head>
  <meta charset="utf-8">
  <meta name="page-type" content="software">
  <meta name="site-kind" content="software">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0A0B0D" id="themeColor">
  <title>PBB live</title>
  <script>
    // The gallery opens after hours. A stored choice wins; otherwise the
    // monitor wall stays dark until the operator switches the lights on.
    (function () {
      var theme;
      try {
        theme = localStorage.getItem("pbb-theme");
      } catch (e) {
        theme = null;
      }
      document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "dark");
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <script src="shaka-player.compiled.min.js"></script>
</head>
<body>
  <div class="page">
    <header class="nav">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
            <path d="M2.5 16 C6 9.5, 26 9.5, 29.5 16 C26 22.5, 6 22.5, 2.5 16 Z" fill="#FFE566" stroke="currentColor" stroke-width="1.8"></path>
            <circle cx="16" cy="16" r="4.6" fill="#E8635A" stroke="currentColor" stroke-width="1.8"></circle>
            <circle cx="16" cy="16" r="1.9" fill="#14110C"></circle>
          </svg>
        </div>
        <div class="brand-copy">
          <h1>PBB live</h1>
        </div>
      </div>
      <div class="desk-actions">
        <div class="seg" role="group" aria-label="default quality">
          <button class="seg-btn" type="button" data-quality="hd">1080</button>
          <button class="seg-btn" type="button" data-quality="sd">480</button>
        </div>
        <button id="themeBtn" class="desk-key" type="button" aria-label="switch to dark theme"></button>
      </div>
    </header>

    <main class="stage">
      <div id="grid" class="grid" aria-label="live camera feeds"></div>
    </main>

    <footer class="status" id="statusBar">
      <span class="status-led" aria-hidden="true"></span>
      <span id="statusText" role="status" aria-atomic="true">connecting feeds...</span>
      <span class="rec-badge hidden" id="recBadge" aria-hidden="true">
        <span class="rec-badge-dot" aria-hidden="true"></span>
        <span id="recCount">0</span>
        <span class="rec-badge-label">rec</span>
        <span id="recTime">0:00</span>
      </span>
      <button id="sourceBtn" class="btn btn-ghost btn-icon" type="button" aria-label="choose stream server"></button>
      <button id="stitchBtn" class="btn btn-ghost btn-icon" type="button" aria-label="record main and dining together"></button>
      <button id="refreshBtn" class="btn btn-ghost btn-icon" type="button" aria-label="refresh streams"></button>
      <button id="backBtn" class="btn btn-ghost btn-icon hidden" type="button" aria-label="back to grid"></button>
    </footer>
  </div>
  <div class="sheet hidden" id="sourceSheet" role="dialog" aria-modal="true" aria-label="stream server">
    <div class="sheet-panel">
      <div class="sheet-head">
        <h2>server</h2>
        <button id="sourceClose" class="btn btn-ghost btn-icon" type="button" aria-label="close servers"></button>
      </div>
      <div class="sheet-chips" id="serverChips" role="group" aria-label="stream server">
        <button class="chip" type="button" data-server="s1">
          <span class="chip-key" aria-hidden="true"></span>
          <span class="chip-copy">
            <span class="chip-name">main server</span>
            <span class="chip-desc">straight from the cdn</span>
          </span>
        </button>
        <button class="chip" type="button" data-server="s2">
          <span class="chip-key" aria-hidden="true"></span>
          <span class="chip-copy">
            <span class="chip-name">backup server</span>
            <span class="chip-desc">through the site proxy</span>
          </span>
        </button>
        <button class="chip" type="button" data-server="s3">
          <span class="chip-key" aria-hidden="true"></span>
          <span class="chip-copy">
            <span class="chip-name">mirror server</span>
            <span class="chip-desc">the pbb3collablive route</span>
          </span>
        </button>
      </div>
      <p class="sheet-note" id="sourceNote"></p>
    </div>
  </div>
  <div id="indicator" class="indicator hidden"></div>
  <div class="fs-controls" role="group" aria-label="fullscreen controls">
    <div class="fs-deck">
      <div class="fs-head">
        <span class="fs-air" aria-hidden="true"><span class="live-pip"></span>on air</span>
      </div>
      <div class="fs-keys">
        <button id="fsZoom" class="fs-key" type="button" aria-label="zoom">
          <span class="fs-glyph" aria-hidden="true"></span>
          <span class="fs-label">zoom</span>
        </button>
        <button id="fsSwitch" class="fs-key" type="button" aria-label="next live feed">
          <span class="fs-glyph" aria-hidden="true"></span>
          <span class="fs-label">next</span>
        </button>
        <button id="fsMini" class="fs-key" type="button" aria-label="mini feed">
          <span class="fs-glyph" aria-hidden="true"></span>
          <span class="fs-label">mini</span>
        </button>
        <button id="fsLock" class="fs-key lock-btn" type="button" aria-label="lock controls">
          <span class="fs-glyph" aria-hidden="true"></span>
          <span class="fs-label">lock</span>
        </button>
        <button id="fsExit" class="fs-key fs-exit" type="button" aria-label="exit fullscreen">
          <span class="fs-glyph" aria-hidden="true"></span>
          <span class="fs-label">exit</span>
        </button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
